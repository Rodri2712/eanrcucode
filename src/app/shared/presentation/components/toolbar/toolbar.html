<mat-toolbar>
  <mat-toolbar-row>

      src="https://img.logo.dev/walmart.com?token=pk_bCrE6Q0hR5mzTDN3sVMQ4A"
      alt="Walmart logo"
      width="32"
      height="32"
    />

    <h1>{{ 'toolbar.title' | translate }}</h1>

    <span class="mat-spacer"></span>

    <a mat-button routerLink="/home" routerLinkActive="active">

    <a mat-button routerLink="/support/issues/new" routerLinkActive="active">

    <app-language-switcher></app-language-switcher>
