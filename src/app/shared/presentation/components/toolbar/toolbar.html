<mat-toolbar>
  <mat-toolbar-row>
    <div class="toolbar-brand">
      <img
        src="https://img.logo.dev/walmart.com?token=pk_bCrE6Q0hR5mzTDN3sVMQ4A"
        alt="Walmart logo"
        width="32"
        height="32"
      />
      <h1>{{ 'toolbar.title' | translate }}</h1>
    </div>

    <nav class="toolbar-navigation" aria-label="Main navigation">
      <a mat-button routerLink="/home" routerLinkActive="active">
        {{ 'toolbar.home' | translate }}
      </a>

      <a
        mat-button
        routerLink="/maintenance/service-orders"
        routerLinkActive="active"
      >
        {{ 'toolbar.service-orders' | translate }}
      </a>

      <a mat-button routerLink="/support/issues/new" routerLinkActive="active">
        {{ 'toolbar.new-issue' | translate }}
      </a>
    </nav>

    <div class="toolbar-language">
      <app-language-switcher />
    </div>
  </mat-toolbar-row>
</mat-toolbar>
